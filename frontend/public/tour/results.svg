<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">CAT results validation and downloads</title>
  <desc id="desc">A completed coding run showing output validation, coded episode rows, and one complete-results download.</desc>
  <defs>
    <style>
      .h1{font:700 28px Arial,sans-serif;fill:#1b1f27}.h2{font:700 19px Arial,sans-serif;fill:#1b1f27}
      .label{font:700 12px Arial,sans-serif;letter-spacing:.6px;fill:#5f6577}.body{font:400 15px Arial,sans-serif;fill:#5f6577}
      .small{font:400 13px Arial,sans-serif;fill:#5f6577}.btn{font:700 14px Arial,sans-serif}.cell{font:400 14px Arial,sans-serif;fill:#5f6577}
    </style>
  </defs>
  <rect width="1200" height="720" rx="12" fill="#f4f5f7"/>
  <rect x="28" y="24" width="1144" height="672" rx="10" fill="#fff" stroke="#d9dce3" stroke-width="2"/>
  <text x="58" y="70" class="h1">Coding Complete</text>
  <rect x="318" y="43" width="124" height="36" rx="18" fill="#dcfce7"/>
  <text x="380" y="67" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#16a34a">3 episodes</text>

  <rect x="58" y="100" width="1084" height="88" rx="8" fill="#dcfce7" stroke="#9dd9ae"/>
  <text x="82" y="133" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#16a34a">✓ Output Validation Complete</text>
  <text x="82" y="162" class="body">No parsing failures or out-of-range values were found.</text>

  <text x="58" y="226" class="label">CODED EPISODES</text>
  <rect x="58" y="242" width="1084" height="184" rx="7" fill="#fff" stroke="#d9dce3"/>
  <rect x="58" y="242" width="1084" height="48" rx="7" fill="#f4f5f7"/>
  <text x="78" y="272" class="label">#</text><text x="126" y="272" class="label">MESSAGE</text><text x="824" y="272" class="label">COOPERATION</text>
  <line x1="58" y1="290" x2="1142" y2="290" stroke="#d9dce3"/>
  <text x="78" y="326" class="cell">1</text><text x="126" y="326" class="cell">[P] Let’s both choose In.  [V1] Sounds good, I’m in.</text>
  <rect x="824" y="305" width="72" height="30" rx="15" fill="#e7f6f7"/><text x="860" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#0d8f9c">yes</text>
  <line x1="58" y1="350" x2="1142" y2="350" stroke="#e8eaef"/>
  <text x="78" y="376" class="cell">2</text><text x="126" y="376" class="cell">[P] Same plan this round?  [V1] Yes, let’s do it.</text>
  <rect x="824" y="355" width="72" height="30" rx="15" fill="#e7f6f7"/><text x="860" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#0d8f9c">yes</text>
  <line x1="58" y1="396" x2="1142" y2="396" stroke="#e8eaef"/>
  <text x="78" y="416" class="cell">3</text><text x="126" y="416" class="cell">[V2] I’ll pass this time.</text>
  <rect x="824" y="397" width="72" height="26" rx="13" fill="#e7f6f7"/><text x="860" y="415" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#0d8f9c">no</text>

  <text x="58" y="466" class="label">DOWNLOAD RESULTS</text>
  <rect x="58" y="482" width="1084" height="132" rx="8" fill="#fff" stroke="#d9dce3"/>
  <text x="82" y="521" class="h2">Complete Results</text>
  <text x="82" y="550" class="small">One ZIP contains overall results, per-LLM results, and every original individual run.</text>
  <text x="82" y="577" class="small">Text responses are separate from the aggregated non-text results.</text>
  <rect x="895" y="521" width="220" height="42" rx="6" fill="#5b3a8e"/>
  <text x="1005" y="548" text-anchor="middle" class="btn" fill="#fff">Download All Results</text>
</svg>
