name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r backend/requirements.txt --disable-pip --progress-spinner off

      - name: Compile backend
        run: python -m compileall -q backend/app

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: python -m unittest discover -s tests -v

      - name: Verify application routes
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: |
          python - <<'PY'
          from app.main import app

          # Inspect the resolved OpenAPI routes. Recent FastAPI/Starlette versions
          # retain included routers as nested objects in app.routes.
          paths = set(app.openapi()["paths"])
          required = {
              "/api/coding/inter-coder-agreement",
              "/api/coding/run-stream",
              "/api/coding/upload-status/{file_id}",
          }
          missing = required - paths
          if missing:
              raise SystemExit(f"Missing required routes: {sorted(missing)}")
          deferred = {
              "/api/files/upload",
              "/api/generate/categories-stream",
              "/api/agreement/cross-check",
              "/api/agreement/compute",
          }
          unexpectedly_active = deferred & paths
          if unexpectedly_active:
              raise SystemExit(f"Deferred routes are active: {sorted(unexpectedly_active)}")
          PY

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: https://ssel.chatkit.nyuad.nyu.edu
        run: npm run build
